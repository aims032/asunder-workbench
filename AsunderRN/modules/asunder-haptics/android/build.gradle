// Tells the Android build that this folder is a small native library.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.asunderhaptics'
version = '0.1.0'

android {
  namespace "expo.modules.asunderhaptics"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}
