# CI: checks that the code compiles and the tests pass on every push.
#
# Four jobs:
#  - core-tests (Linux, cheap): runs AsunderCore's unit tests. This covers the
#    clock and wrap math every phone has to agree on.
#  - rn-tests (Linux, cheap): the React Native app in AsunderRN. Checks the
#    TypeScript types, then runs its tests, which include comparing the ported
#    core against numbers saved from the Swift core (swift-golden.json).
#  - media-tests (Linux, cheap): the media server in media/ (Worker + pack tools).
#  - ios-build (macOS, costs ~10x more minutes): builds the actual iPhone app
#    for the simulator. It runs on pull requests and on demand, not on every push.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test AsunderCore
        run: swift test --package-path AsunderCore

  rn-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AsunderRN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AsunderRN/package-lock.json
      # "npm ci" installs exactly the versions written in package-lock.json.
      - name: Install packages
        run: npm ci
      - name: Check types
        run: npx tsc --noEmit
      - name: Run tests
        run: npx jest

  media-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: media/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Check types
        run: npx tsc --noEmit
      # Checks the media server only hands out packs that have unlocked.
      - name: Run tests
        run: npm test

  ios-build:
    if: github.event_name != 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build app for the iOS Simulator
        run: |
          xcodebuild build \
            -project Asunder.xcodeproj \
            -scheme Asunder \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      # The radio must keep playing with the screen off. That needs "audio" in
      # UIBackgroundModes in the built app's Info.plist; fail loudly if it's missing.
      - name: Check background audio is declared
        run: |
          plist=build/Build/Products/Debug-iphonesimulator/Asunder.app/Info.plist
          plutil -extract UIBackgroundModes json -o - "$plist" | tee /dev/stderr | grep -q '"audio"'
